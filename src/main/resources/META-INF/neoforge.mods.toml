modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/team-abnormals/neapolitan/issues"
license = "https://github.com/team-abnormals/neapolitan/blob/main/LICENSE.txt"

[[mixins]]
    config = "neapolitan.mixins.json"

[[mods]]
    modId = "neapolitan"
    version = "${mod_version}"
    logoFile = "logo.png"
    itemIcon = "neapolitan:neapolitan_ice_cream"
    configBackground = "neapolitan:textures/block/chocolate_bricks.png"
    authors = "Team Abnormals"
    credits = "bageldotjpg, five, Markus1002"
    displayURL = "https://www.teamabnormals.com/mods/neapolitan"
    displayName = "Neapolitan"
    description = '''
    Adds new flavors and fruits to create tasty Ice Creams, Milkshakes, Cakes, and more!
    '''

[[dependencies.neapolitan]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${mc_version}]"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.neapolitan]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.neapolitan]]
    modId = "blueprint"
    type = "required"
    versionRange = "[${blueprint},)"
    ordering = "AFTER"
    side = "BOTH"